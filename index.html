<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACN</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='10' fill='%233964FE'/><text x='18' y='25' text-anchor='middle' font-size='19' font-weight='600' fill='%23FFFFFF' font-family='sans-serif'>A</text></svg>" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root {
      /* —— 底色层（personal-site DeepSeek neutral-bluish） —— */
      --bg-base: #151517;
      --bg-layer-1: #232324;
      --bg-layer-2: #2c2c2e;
      --bg-layer-3: #353638;
      --bg-elevated: #353638;
      /* —— 描边 —— */
      --border-l1: rgba(255,255,255,0.06);
      --border-l2: rgba(255,255,255,0.12);
      --border-l3: rgba(255,255,255,0.16);
      --border-l4: rgba(255,255,255,0.20);
      /* —— 文字阶 —— */
      --text-primary: #f9fafb;
      --text-secondary: #cfd3d6;
      --text-tertiary: #81858c;
      --text-caption: #61666b;
      /* —— 品牌蓝 —— */
      --accent: #3964fe;
      --accent-hover: #5686fe;
      --accent-active: #679efe;
      --accent-weak: rgba(57,100,254,0.16);
      /* —— 状态色 —— */
      --success: #22c55e;
      --danger: #f25a5a;
      --warning: #f59e0b;
      /* —— 圆角 —— */
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      /* —— 字体 / 动效 / 阴影 —— */
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --ds-fast: 120ms;
      --ds-ease: cubic-bezier(.2, 0, 0, 1);
      --shadow-lv2: 0 4px 12px 0 rgba(0,0,0,0.02), 0 2px 8px 0 rgba(0,0,0,0.04);
      --shadow-lv3: 0 0 1px 0 rgba(0,0,0,0.2), 0 0 4px 0 rgba(0,0,0,0.02), 0 12px 32px 0 rgba(0,0,0,0.08);
    }
    html[data-theme="light"] {
      --bg-base: #ffffff;
      --bg-layer-1: #ffffff;
      --bg-layer-2: #f5f6f7;
      --bg-layer-3: #ebeef2;
      --bg-elevated: #ebeef2;
      --border-l1: rgba(0,0,0,0.04);
      --border-l2: rgba(0,0,0,0.10);
      --border-l3: rgba(0,0,0,0.12);
      --border-l4: rgba(0,0,0,0.16);
      --text-primary: #0f1115;
      --text-secondary: #43454a;
      --text-tertiary: #81858c;
      --text-caption: #adb2b8;
      --accent: #3964fe;
      --accent-hover: #5686fe;
      --accent-active: #679efe;
      --accent-weak: rgba(57,100,254,0.10);
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== 背景层（仓库静态资源，纯色蒙层，无渐变） ===== */
    .site-bg {
      position: fixed;
      /* 桌面：左侧 300px 固定纯色侧栏会盖住背景，背景只铺舞台区，避免人物被压在侧栏下 */
      inset: 0 0 0 300px;
      z-index: 0;
      background: var(--bg-base) url('assets/bg/user/bg-acn-client-window.jpg') center center / cover no-repeat;
    }
    .site-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(21, 21, 23, 0.52);
    }
    html[data-theme="light"] .site-bg::after {
      background: rgba(255, 255, 255, 0.58);
    }

    /* ===== 左侧边栏（对齐主站 personal-site 侧栏） ===== */
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 300px;
      z-index: 200;
      background: var(--bg-base);
      border-right: 1px solid var(--border-l1);
      display: flex;
      flex-direction: column;
    }
    .sidebar-brand {
      flex-shrink: 0;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-l1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-svg { display: block; flex-shrink: 0; }
    .brand-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
    }

    /* ===== 网站介绍 ===== */
    .intro { margin-bottom: 20px; }
    .intro-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }
    .intro-sub {
      margin-top: 4px;
      color: var(--text-tertiary);
      font-size: 12.5px;
      line-height: 20px;
    }
    .intro-text {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 21px;
    }

    /* ===== 主舞台（背景图之上） ===== */
    .stage {
      position: relative;
      z-index: 1;
      margin-left: 300px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 0;
    }
    .stage-inner {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      padding: 7vh 40px 0;
    }
    .stage-mark {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 8px;
      line-height: 1.1;
      color: rgba(249, 250, 251, 0.92);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    }
    .stage-sub {
      margin-top: 6px;
      font-size: 13px;
      letter-spacing: 4px;
      color: rgba(249, 250, 251, 0.62);
    }
    html[data-theme="light"] .stage-mark { color: rgba(15, 17, 21, 0.86); text-shadow: 0 2px 18px rgba(255, 255, 255, 0.5); }
    html[data-theme="light"] .stage-sub { color: rgba(15, 17, 21, 0.55); }

    /* ===== 状态提示 ===== */
    .status {
      font-size: 14px;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--accent-weak);
      border-top: 2px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status.error { color: var(--danger); }
    .status.success { color: var(--success); }
    .retry-link {
      display: none;
      margin-top: 16px;
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }
    .retry-link.show { display: inline-block; }

    /* ===== 站点选择卡片 ===== */
    .site-list {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .site-list.show { display: flex; }
    .site-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-radius: var(--radius-lg);
      background: var(--bg-layer-1);
      border: 1px solid var(--border-l2);
      cursor: pointer;
      transition: background-color var(--ds-fast) var(--ds-ease),
                  border-color var(--ds-fast) var(--ds-ease),
                  transform var(--ds-fast) var(--ds-ease),
                  box-shadow var(--ds-fast) var(--ds-ease);
      text-decoration: none;
      color: var(--text-secondary);
      box-shadow: var(--shadow-lv2);
    }
    .site-card:not(.disabled):hover {
      background: var(--bg-layer-2);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lv3);
    }
    .site-card:active:not(.disabled) { transform: scale(.985); }
    .site-card.disabled {
      background: var(--bg-layer-1);
      border-color: var(--border-l1);
      cursor: not-allowed;
      opacity: 0.5;
    }
    .site-card-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .site-card-icon.active {
      background: var(--accent);
      color: #ffffff;
    }
    .site-card-icon.inactive {
      background: var(--bg-layer-3);
      color: var(--text-tertiary);
    }
    .site-card-info { flex: 1; }
    .site-card-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .site-card.disabled .site-card-name {
      color: var(--text-tertiary);
    }
    .site-card-desc {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .site-card-badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-closed {
      background: rgba(242,90,90,0.14);
      color: var(--danger);
      border: 1px solid rgba(242,90,90,0.2);
    }
    .badge-open {
      background: rgba(34,197,94,0.14);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.2);
    }
    .maintenance-msg {
      display: none;
      margin-top: 20px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      background: rgba(245,158,11,0.10);
      border: 1px solid rgba(245,158,11,0.2);
      color: var(--warning);
      font-size: 13px;
      text-align: center;
      width: 100%;
      line-height: 1.6;
    }
    .maintenance-msg.show { display: block; }

    .footer {
      flex-shrink: 0;
      width: 100%;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
      font-size: 12px;
      color: rgba(249, 250, 251, 0.62);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      background: rgba(21, 21, 23, 0.42);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .footer-links {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .footer-links a {
      color: rgba(249, 250, 251, 0.72);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-links a:hover { color: var(--accent); }
    html[data-theme="light"] .footer {
      color: rgba(15, 17, 21, 0.58);
      text-shadow: none;
      background: rgba(255, 255, 255, 0.5);
      border-top-color: rgba(0, 0, 0, 0.06);
    }
    html[data-theme="light"] .footer-links a { color: rgba(15, 17, 21, 0.7); }

    /* ===== 一致性层（对齐 personal-site 设计系统） ===== */
    :where(a, button, .site-card, .retry-link, [role="button"], [tabindex]):focus-visible {
      outline: 2px solid var(--text-primary);
      outline-offset: 2px;
    }
    .site-card:focus-visible { outline-color: var(--accent); }
    ::selection { background: rgba(160,164,170,0.30); color: var(--text-primary); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* ===== 窄屏：侧边栏转为顶部块 ===== */
    @media (max-width: 860px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-l1);
      }
      .sidebar-body { overflow: visible; }
      .stage {
        margin-left: 0;
        min-height: auto;
        padding: 0 24px;
      }
      .stage-inner { padding: 48px 0; }
      .stage-mark { font-size: 44px; letter-spacing: 6px; }
      /* 窄屏横版背景会被 cover 裁成竖条：换成同源竖版裁切，人物完整可见且不被顶部侧栏块盖住脸 */
      .site-bg {
        left: 0;
        background-image: url('assets/bg/user/bg-acn-client-window-mobile.jpg');
      }
    }
  </style>
</head>
<body>
  <!-- 背景层：仓库静态资源 -->
  <div class="site-bg" aria-hidden="true"></div>

  <!-- 左侧边栏：品牌 + 网站介绍 + 状态 -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a class="brand" href="./">
        <svg class="logo-svg" width="28" height="28" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#3964FE"/>
          <text x="18" y="25" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF" font-family="sans-serif">A</text>
        </svg>
        <span class="brand-name">ACN CLIENT</span>
      </a>
    </div>

    <div class="sidebar-body">
      <!-- 网站介绍 -->
      <section class="intro">
        <h1 class="intro-title">文件下载</h1>
        <p class="intro-sub">文件获取 · 在线工具，即点即用</p>
        <p class="intro-text">
          ACN CLIENT 是面向 ACN 玩家的综合服务平台，在这里可以获取文件资源、使用在线工具、
          提交 ACN ROBOT 自动化任务，并上传与共享网易基岩版结构文件。
        </p>
      </section>

      <!-- 状态提示（加载中/错误） -->
      <div class="status" id="statusMsg">
        <div class="spinner" id="spinner"></div>
        <span>正在连接服务器...</span>
      </div>
      <div class="retry-link" id="retryLink" onclick="retry()">重试</div>

      <!-- 站点选择列表（开关关闭时显示） -->
      <div class="site-list" id="siteList">
        <div class="site-card disabled" id="siteCard">
          <div class="site-card-icon inactive" id="siteIcon">📦</div>
          <div class="site-card-info">
            <div class="site-card-name" id="siteName">下载中心</div>
            <div class="site-card-desc">文件下载</div>
          </div>
          <div class="site-card-badge badge-closed" id="siteBadge">已关闭</div>
        </div>
      </div>

      <!-- 维护公告 -->
      <div class="maintenance-msg" id="maintMsg"></div>
    </div>
  </aside>

  <!-- 主舞台 -->
  <main class="stage">
    <div class="stage-inner">
      <div class="stage-mark">ACN</div>
      <div class="stage-sub">CLIENT</div>
    </div>
    <footer class="footer">
      <span>Copyright &copy; 2026 ACN CLIENT All Rights Reserved. 本网站所有权归 ACN CLIENT 所有</span>
      <span class="footer-links">
        <a href="#" id="termsLink">用户协议 · 免责声明</a>
      </span>
    </footer>
  </main>

  <script>
    var REPO = 'xnnkk/Xnnkk-ACN';

    function setStatus(text, type) {
      var el = document.getElementById('statusMsg');
      el.className = 'status' + (type ? ' ' + type : '');
      el.innerHTML = (type ? '' : '<div class="spinner" id="spinner"></div>') + '<span>' + text + '</span>';
      var retry = document.getElementById('retryLink');
      if (type === 'error') retry.classList.add('show');
      else retry.classList.remove('show');
    }

    function hideStatus() {
      document.getElementById('statusMsg').style.display = 'none';
      document.getElementById('retryLink').style.display = 'none';
    }

    function httpGet(url, onSuccess, onError, timeoutMs) {
      var xhr = new XMLHttpRequest();
      xhr.timeout = timeoutMs || 5000;
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            onSuccess(xhr.responseText.trim());
          } else {
            onError('HTTP ' + xhr.status);
          }
        }
      };
      xhr.ontimeout = function() { onError('timeout'); };
      xhr.onerror = function() { onError('network error'); };
      try { xhr.open('GET', url, true); xhr.send(); }
      catch (e) { onError(e.message); }
    }

    // 两级源获取：先请求可信源（同源 GitHub Pages / raw，无 CDN 缓存问题），
    // 全部失败才启动 jsDelivr CDN 后备。避免 CDN 缓存旧隧道导致乱跳转。
    function fetchFromSources(filename, onSuccess, onError) {
      var ts = Date.now();
      var done = false;

      // ===== 一级源：可信源（数据永远是 GitHub 最新） =====
      function tryPrimary() {
        var pending = 2;
        var resolved = false;
        // 同源（GitHub Pages）立即发——与跳转页同 CDN，更新最快、最可靠
        httpGet(filename + '?t=' + ts, pSucceed, pFail, 5000);
        // raw.githubusercontent 延迟 400ms 再发，避免其 CDN 缓存旧数据抢答
        setTimeout(function() {
          if (resolved || done) return;
          httpGet('https://raw.githubusercontent.com/' + REPO + '/main/' + filename + '?t=' + ts, pSucceed, pFail, 5000);
        }, 400);
        function pFail() {
          if (resolved || done) return;
          pending--;
          if (pending <= 0) {
            resolved = true;
            tryFallback();
          }
        }
        function pSucceed(text) {
          if (resolved || done) return;
          if (text && text.length > 0) {
            resolved = true;
            done = true;
            onSuccess(text);
          } else {
            pFail();
          }
        }
      }

      // ===== 二级源：jsDelivr CDN（仅一级源全部失败后启用） =====
      function tryFallback() {
        var fallback = [
          'https://fastly.jsdelivr.net/gh/' + REPO + '@main/' + filename + '?t=' + ts,
          'https://cdn.jsdelivr.net/gh/' + REPO + '@main/' + filename + '?t=' + ts,
          'https://gcore.jsdelivr.net/gh/' + REPO + '@main/' + filename + '?t=' + ts
        ];
        var pending = fallback.length;
        var resolved = false;
        function fFail() {
          if (resolved || done) return;
          pending--;
          if (pending <= 0) {
            resolved = true;
            done = true;
            onError('all sources failed');
          }
        }
        function fSucceed(text) {
          if (resolved || done) return;
          if (text && text.length > 0) {
            resolved = true;
            done = true;
            onSuccess(text);
          } else {
            fFail();
          }
        }
        for (var i = 0; i < fallback.length; i++) {
          httpGet(fallback[i], fSucceed, fFail, 5000);
        }
      }

      tryPrimary();
    }

    // ===== 主流程：先读开关，再决定行为 =====
    function init() {
      setStatus('正在检查服务状态...', '');
      fetchFromSources('switch.json', function(text) {
        var config;
        try {
          config = JSON.parse(text);
        } catch (e) {
          // switch.json 解析失败，默认开启
          startRedirect();
          return;
        }

        if (config.enabled === false) {
          // ===== 网站已关闭 =====
          showSiteClosed(config.message || '');
        } else {
          // ===== 网站开启，正常跳转 =====
          startRedirect();
        }
      }, function() {
        // switch.json 获取失败，默认开启（向后兼容）
        startRedirect();
      });
    }

    // 正常跳转流程：先取 url.txt，再验证隧道可访问性，正常才跳转
    function startRedirect() {
      setStatus('正在连接服务器...', '');
      fetchFromSources('url.txt', function(text) {
        if (text && text.indexOf('http') === 0) {
          var url = text.replace(/\/+$/, '');
          // 用户协议链接指向主站协议页
          var terms = document.getElementById('termsLink');
          if (terms) terms.href = url + '/agreement.html';
          verifyTunnel(url);
        } else {
          setStatus('⚠ 服务器暂时无法连接，请检查网络后重试', 'error');
        }
      }, function() {
        setStatus('⚠ 无法连接服务器（网络受限或 DNS 被拦截），请尝试切换网络或更换浏览器', 'error');
      });
    }

    // 跳转前验证隧道地址是否可访问、存在、正常（HTTP 200-299 才放行，异常终止跳转）
    function verifyTunnel(url) {
      setStatus('正在验证服务器状态...', '');
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 8000);
      fetch(url + '/', {
        method: 'HEAD',
        mode: 'cors',
        cache: 'no-store',
        redirect: 'follow',
        signal: controller.signal
      }).then(function(resp) {
        clearTimeout(timer);
        if (resp.ok) {
          setStatus('✓ 连接成功，正在跳转...', 'success');
          setTimeout(function() { window.location.href = url; }, 350);
        } else {
          setStatus('⚠ 服务器暂时不可用（HTTP ' + resp.status + '），请稍后重试', 'error');
        }
      }).catch(function() {
        clearTimeout(timer);
        setStatus('⚠ 服务器暂时掉线，请稍后重试...', 'error');
      });
    }

    // 显示站点关闭界面
    function showSiteClosed(message) {
      hideStatus();
      document.getElementById('siteList').classList.add('show');
      if (message) {
        var msgEl = document.getElementById('maintMsg');
        msgEl.textContent = message;
        msgEl.classList.add('show');
      }
    }

    function retry() {
      document.getElementById('siteList').classList.remove('show');
      document.getElementById('maintMsg').classList.remove('show');
      document.getElementById('statusMsg').style.display = '';
      init();
    }

    // 启动
    init();

    (function() {
      var CURRENT_VERSION = '32';
      try {
        var stored = localStorage.getItem('redirect_portal_version');
        if (stored !== CURRENT_VERSION) {
          localStorage.setItem('redirect_portal_version', CURRENT_VERSION);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
